name: Pages

# Publishes the site in site/ to https://w3c-oss.github.io/w3c-companion/. Its install steps link to the latest
# release's zip, and switch to the store pages once Firefox Add-ons and the Chrome Web Store list the extension. And it
# serves the browser-support, MDN, Can I Use, and test-results files the extension fetches, built from the latest BCD,
# mdn/content, caniuse-db, web-features, and wpt.fyi runs. So the workflow also runs after each release and every hour,
# and an hourly run deploys only when the page or one of those files has changed.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'screenshots/**'
      - 'static/icons/**'
      - 'store/privacy.md'
      - 'scripts/site.ts'
      - 'scripts/bcd.ts'
      - 'scripts/mdn.ts'
      - 'scripts/caniuse.ts'
      - 'scripts/wpt.ts'
      - 'src/logic/implementations.ts'
      - 'src/logic/mdn.ts'
      - 'src/logic/caniuse.ts'
      - 'src/logic/wpt.ts'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the site for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          SITE_VERSION=${tag#v} npm run site
      - name: Compare the site with the deployed one
        id: compare
        run: |
          site=https://w3c-oss.github.io/w3c-companion
          if [ "$GITHUB_EVENT_NAME" = schedule ] \
            && curl -fsS "$site/" | cmp -s - _site/index.html \
            && curl -fsS "$site/data/implementations.json" | cmp -s - _site/data/implementations.json \
            && curl -fsS "$site/data/mdn.json" | cmp -s - _site/data/mdn.json \
            && curl -fsS "$site/data/caniuse.json" | cmp -s - _site/data/caniuse.json \
            && curl -fsS "$site/data/wpt.json" | cmp -s - _site/data/wpt.json; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v5
        if: steps.compare.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
